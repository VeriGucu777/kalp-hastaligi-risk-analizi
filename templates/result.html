<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Analiz Sonucu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e3f2fd, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .risk {
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .low {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .medium {
            background-color: #fff8e1;
            color: #f9a825;
        }

        .high {
            background-color: #ffebee;
            color: #c62828;
        }

        button {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0d47a1;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>🩺 Analiz Sonucu</h2>

    {% if "YÜKSEK" in sonuc %}
        <div class="risk high">{{ sonuc }}</div>
    {% elif "ORTA" in sonuc %}
        <div class="risk medium">{{ sonuc }}</div>
    {% else %}
        <div class="risk low">{{ sonuc }}</div>
    {% endif %}

    <a href="/">
        <button>Geri Dön</button>
    </a>

</div>

</body>
</html>
